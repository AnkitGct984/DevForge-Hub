<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Tic Tac Toe</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="c.css">
</head>

<body>
    <!-- Background Animated Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Link back to Portfolio -->
    <a href="portfolio.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to Portfolio
    </a>

    <div class="container">
        <div class="game-header">
            <h1 class="gradient-text">Tic Tac Toe</h1>
            <div class="scoreboard">
                <div class="score-card player-x active-player">
                    <span class="player-name">Player X</span>
                    <span class="score" id="score-x">0</span>
                </div>
                <div class="score-card player-o">
                    <span class="player-name">Player O</span>
                    <span class="score" id="score-o">0</span>
                </div>
            </div>
            <p class="status" id="status-text">Player X's Turn</p>
        </div>

        <div class="game-board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button class="btn btn-primary" id="reset-btn">
            <i class="fa-solid fa-rotate-right"></i> Reset Game
        </button>
    </div>

    <!-- Win Modal -->
    <div class="modal-overlay" id="win-modal">
        <div class="modal-content">
            <div class="modal-icon" id="modal-icon">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 id="modal-title">Player X Wins!</h2>
            <button class="btn btn-primary" id="play-again-btn">Play Again</button>
        </div>
    </div>

    <script src="c.js"></script>
</body>

</html>
