<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Weather App</title>
    <!-- Add Google Fonts and FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="as.css">
</head>

<body>
    <!-- Link back to Portfolio -->
    <a href="portfolio.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to Portfolio
    </a>

    <div class="card">
        <div class="search">
            <input type="text" id="search-input" placeholder="Enter city name..." spellcheck="false">
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="error" style="display: none;">
            <p>Invalid city name</p>
        </div>

        <div class="weather" style="display: none;">
            <img src="https://cdn-icons-png.flaticon.com/512/3222/3222800.png" class="weather-icon" id="weather-icon"
                alt="weather condition">
            <h1 class="temp" id="temp">22°C</h1>
            <h2 class="city" id="city-name">New York</h2>

            <div class="details">
                <div class="col">
                    <i class="fa-solid fa-water fa-2x"></i>
                    <div>
                        <p class="humidity" id="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="col">
                    <i class="fa-solid fa-wind fa-2x"></i>
                    <div>
                        <p class="wind" id="wind-speed">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- The actual logic -->
    <script src="as.js"></script>
</body>

</html>
